name: Build Windows Electron release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/dim-sum-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dim-sum-atlas/package-lock.json
      - run: npm ci
      - run: npm run validate:additions
      - run: npm run validate:data
      - name: Bundle the public catalog into the app
        shell: pwsh
        run: |
          Copy-Item '../../catalog/index.json' 'catalog.json' -Force
          $catalog = Get-Content 'catalog.json' -Raw | ConvertFrom-Json
          $seen = [System.Collections.Generic.HashSet[string]]::new([string[]]$catalog.dishes.id)
          Get-ChildItem '../../catalog/additions-*.json' | Sort-Object Name | ForEach-Object {
            $additions = Get-Content $_.FullName -Raw | ConvertFrom-Json
            foreach ($dish in @($additions.dishes)) { if ($seen.Add($dish.id)) { $catalog.dishes += $dish } }
          }
          $catalog | ConvertTo-Json -Depth 20 | Set-Content 'catalog.json' -Encoding utf8
      - name: Bundle portable 7-Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'portable/7z' | Out-Null
          Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile 'portable/7z/7z.exe'
          if ((Get-Item 'portable/7z/7z.exe').Length -lt 100000) { throw 'The downloaded portable 7-Zip binary is unexpectedly small.' }
      - name: Build Windows installer
        shell: pwsh
        run: npm run build:installer
      - name: Package portable Windows app
        shell: pwsh
        run: npx --no-install @electron/packager . "Dim Sum Atlas" --platform=win32 --arch=x64 --out=release --overwrite --asar
      - name: Zip portable app
        shell: pwsh
        run: |
          7z a -tzip -mx=1 'dim-sum-atlas-win-x64.zip' './release/Dim Sum Atlas-win32-x64/*'
          if (-not (Test-Path 'dim-sum-atlas-win-x64.zip')) { throw 'Portable ZIP was not produced.' }
      - name: Publish immutable release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "desktop-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,8))"
          $catalog = Get-Content "catalog/index.json" -Raw | ConvertFrom-Json
          $verified = @($catalog.dishes | Where-Object { $_.image.path })
          $dish = $verified[($env:GITHUB_RUN_NUMBER - 1) % $verified.Count]
          $photoName = Split-Path $dish.image.path -Leaf
          $photo = "apps/dim-sum-atlas/$photoName"
          Invoke-WebRequest -Uri "https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/catalog-v1/$photoName" -OutFile $photo
          $codeName = "$($dish.name.en) · $($dish.name.zhHant)"
          $assets = @("apps/dim-sum-atlas/dim-sum-atlas-win-x64.zip", $photo) + @(Get-ChildItem 'apps/dim-sum-atlas/dist/*.exe' | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 3) { throw 'The Windows installer was not produced.' }
          gh release create $tag $assets --repo "$env:GITHUB_REPOSITORY" --title "Dim Sum Atlas $tag" --notes "Windows installer and portable build. Catalog code name: $codeName. Embedded photo asset: $photoName."
