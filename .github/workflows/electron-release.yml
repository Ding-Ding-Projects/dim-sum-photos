name: Build Windows Electron release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/dim-sum-atlas
    steps:
      - name: Record workflow start
        id: timing
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: "\"workflow_start=$((Get-Date).ToUniversalTime().ToString('o'))\" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/dim-sum-atlas/package-lock.json
      - name: Install declared dependencies
        run: npm ci --ignore-scripts
      - name: Enable Electron install script explicitly
        run: npm rebuild electron --foreground-scripts
      - name: Assemble deterministic catalog
        run: npm run assemble:catalog
      - name: Pin and verify portable 7-Zip
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File '../../scripts/bootstrap-portable-7z.ps1'
      - name: Build unsigned Squirrel.Windows installer
        shell: pwsh
        run: npm run build:installer
      - name: Verify installer contract and hashes
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/squirrel-windows -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe missing from Squirrel output.' }
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne 'NotSigned') { throw "Installer signing status is $($sig.Status), expected NotSigned." }
          node ../../scripts/verify-installer.mjs "--signature-status=$($sig.Status)"
          Get-FileHash dist/squirrel-windows/* -Algorithm SHA256 | ConvertTo-Json | Set-Content dist/squirrel-windows/hashes.json
      - name: Count lines at the release commit
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checked-out commit $actual does not match GITHUB_SHA $env:GITHUB_SHA." }
          node scripts/count-lines.mjs | Set-Content line-count.md -Encoding utf8
          node scripts/count-lines.mjs --json | Set-Content line-count.json -Encoding utf8
      - name: Publish immutable release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse('${{ steps.timing.outputs.workflow_start }}')
          $tag = "desktop-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,8))"
          $assets = Get-ChildItem 'apps/dim-sum-atlas/dist/squirrel-windows' -File | Where-Object { $_.Extension -in '.exe','.nupkg' -or $_.Name -in 'RELEASES','hashes.json','installer-manifest.json' }
          if (-not ($assets | Where-Object Extension -eq '.exe')) { throw 'No Setup.exe asset exists.' }
          $catalog = Get-Content 'catalog/index.json' -Raw | ConvertFrom-Json
          $seen = [System.Collections.Generic.HashSet[string]]::new([string[]]$catalog.dishes.id)
          Get-ChildItem 'catalog/additions-*.json' | Sort-Object Name | ForEach-Object { $a=Get-Content $_.FullName -Raw | ConvertFrom-Json; foreach($d in @($a.dishes)){if($seen.Add($d.id)){$catalog.dishes+=$d}} }
          $available = @($catalog.dishes | Where-Object { $_.image.path })
          if (-not $available.Count) { throw 'No published catalog photo record is available.' }
          $dish = $available[([int]$env:GITHUB_RUN_NUMBER - 1) % $available.Count]
          $photoName = Split-Path $dish.image.path -Leaf
          $number = [int]([regex]::Match($dish.id, '\d+$').Value)
          $part = if ($number -le 995) { 1 } else { [math]::Floor(($number - 996) / 990) + 2 }
          $imageRelease = if ($part -eq 1) { 'catalog-v1' } else { "catalog-v1-part-{0:D3}" -f $part }
          $photo = Join-Path $env:RUNNER_TEMP $photoName
          Invoke-WebRequest -Uri "https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/$imageRelease/$photoName" -OutFile $photo
          $codeName = "$($dish.name.en) · $($dish.name.zhHant)"
          $photoHash = (Get-FileHash $photo -Algorithm SHA256).Hash.ToLowerInvariant()
          $assets += Get-Item $photo
          node 'scripts/generate-update-metadata.mjs' "--tag=$tag" "--commit=$env:GITHUB_SHA" "--repo=$env:GITHUB_REPOSITORY"
          $metadata = Get-Item 'apps/dim-sum-atlas/dist/squirrel-windows/update.json'
          $assets += $metadata
          $lineCount = Get-Content 'line-count.md' -Raw
          $notes = "Windows Squirrel.Windows installer, intentionally unsigned.`n`nTarget commit: $env:GITHUB_SHA`nCode name: $codeName`nCatalog record: $($dish.id)`nPhoto provenance: catalog release $imageRelease, asset $photoName, SHA-256 $photoHash.`nPackaging provenance: electron-builder 26.15.3, Squirrel.Windows, signing disabled; independent Authenticode status: NotSigned.`n`n## Project line count`n`n$lineCount`n"
          gh release create $tag --target $env:GITHUB_SHA --repo "$env:GITHUB_REPOSITORY" --title "Dim Sum Atlas $tag" --draft --notes $notes ($assets.FullName)
          $end = [DateTimeOffset]::UtcNow
          $duration = $end - $start
          $hashLines = ($assets | ForEach-Object { "- $($_.Name): $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" }) -join "`n"
          $notes = "$notes`nWorkflow started: $($start.ToString('o'))`nWorkflow completed: $($end.ToString('o'))`nWorkflow duration: $($duration.ToString('hh\:mm\:ss'))`n`nAsset SHA-256:`n$hashLines"
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --draft=false --latest --notes-file release-notes.md
