name: Publish Dim Sum Atlas Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site data
        shell: bash
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('catalog/index.json'));const seen=new Set(c.dishes.map(d=>d.id));for(const f of fs.readdirSync('catalog').filter(f=>/^additions-.*\\.json$/i.test(f)).sort()){const a=JSON.parse(fs.readFileSync('catalog/'+f));for(const d of a.dishes||[])if(!seen.has(d.id)){c.dishes.push(d);seen.add(d.id)}}fs.writeFileSync('site/catalog.json',JSON.stringify(c,null,2));"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
