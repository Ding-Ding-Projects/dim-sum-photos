name: Publish Dim Sum Atlas Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site data
        shell: bash
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('catalog/index.json'));const a=JSON.parse(fs.readFileSync('catalog/additions-3009-3030.json'));const seen=new Set(c.dishes.map(d=>d.id));c.dishes.push(...a.dishes.filter(d=>!seen.has(d.id)));fs.writeFileSync('site/catalog.json',JSON.stringify(c,null,2));"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
